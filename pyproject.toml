[project]
name = "mikan"
version = "0.0.1"
description = "Distil a large model's behaviour on one narrow task into a small open model, with a pre-registered non-inferiority evaluation."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8", "modal>=1.2"]

[project.scripts]
mikan-eval = "mikan.eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mikan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
